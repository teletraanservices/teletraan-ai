<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teletraan AI - Teletraan Services</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="image.png" alt="Logo de Teletraan Services" class="logo">
            <h1>TELETRAAN <span>AI</span></h1>
            <div class="subtitle">Cybertronian Technology • Learning Module</div>
        </header>
        
        <div id="chat-box" class="chat-box">
            <div class="message ai-message">
                Saludos. Soy Teletraan AI, tu asistente de aprendizaje en Teletraan Services. ¿Qué disciplina deseas dominar el día de hoy? Procederemos paso a paso.
            </div>
        </div>
        
        <div id="typing" class="typing-indicator">Teletraan AI está procesando...</div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ej: Inicializar módulo de Física Cuántica...">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
